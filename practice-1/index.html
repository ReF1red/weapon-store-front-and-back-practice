<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsenal One — Карточка товара</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="layout">
        <section class="showcase">
            <p class="eyebrow">Оружейный магазин</p>
            <h1>Glock 17 Gen5</h1>
            <p class="subtitle">Надежный служебный пистолет с полимерной рамой, модульной эргономикой и ресурсом для интенсивной эксплуатации.</p>

            <div class="card">
                <img class="card__image" src="../images/glock_17.jpeg" alt="Glock 17 Gen5">

                <div class="card__body">
                    <div class="card__row">
                        <span class="chip">Калибр 9x19</span>
                        <span class="chip chip--dark">В наличии: 21</span>
                    </div>

                    <ul class="specs">
                        <li>Длина ствола: 114 мм</li>
                        <li>Емкость магазина: 17 патронов</li>
                        <li>Материал затвора: сталь</li>
                    </ul>

                    <div class="card__footer">
                        <div>
                            <p class="price-label">Цена</p>
                            <p class="price">96 000 ₽</p>
                        </div>
                        <a class="btn" href="#">Добавить в заказ</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
